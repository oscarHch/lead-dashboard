<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard LEAD UNMSM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Poppins', 'sans-serif'] },
          colors: { lead: { purple: '#8027AC', pink: '#EB427D', blue: '#03106A', dark: '#031346', white: '#FFFFFF' } }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50 text-gray-800 antialiased overflow-x-hidden">
  <header class="bg-lead-dark text-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <span class="font-bold text-base sm:text-lg tracking-wide">LEAD UNMSM</span>
      </div>
    </div>
  </header>
  <main class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-8">
    <div id="pantallaCarga" class="flex justify-center items-center py-20">
      <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-lead-purple"></div>
      <span class="ml-3 text-lead-purple font-medium text-sm">Cargando datos en el celular...</span>
    </div>
    <div id="contenidoDashboard" class="hidden">
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
        <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-l-lead-dark">
          <p class="text-xs text-gray-400 uppercase font-semibold">Alcance Total</p>
          <p id="kpiAlcance" class="text-2xl font-semibold text-lead-dark mt-1">0</p>
        </div>
        <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-l-lead-blue">
          <p class="text-xs text-gray-400 uppercase font-semibold">Visualizaciones</p>
          <p id="kpiVistas" class="text-2xl font-semibold text-lead-blue mt-1">0</p>
        </div>
      </div>
      <div class="bg-white p-5 rounded-xl shadow-sm border">
        <div class="relative h-72 w-full"><canvas id="graficoResultados"></canvas></div>
      </div>
    </div>
  </main>
  <script>
    // PEGA AQUÍ ABAJO TU URL QUE COPIASTE DE APPS SCRIPT ENTRE LAS COMILLAS
    const URL_API = "https://script.google.com/macros/s/AKfycbwW6cqhmDeUY9qz3uoxgpEUJ3q9Y4hOKJHfzLnVehfDR9HtmBrGxTq5JSj1RTkWA_v_/exec";

    window.onload = async function() {
      try {
        let res = await fetch(URL_API + "?action=getData");
        let json = await res.json();
        let datos = json.resultados;

        let tAlc = datos.reduce((a, b) => a + Number(b.Alcance || 0), 0);
        let tVis = datos.reduce((a, b) => a + Number(b.Visualizaciones || 0), 0);

        document.getElementById('kpiAlcance').innerText = tAlc.toLocaleString();
        document.getElementById('kpiVistas').innerText = tVis.toLocaleString();

        document.getElementById('pantallaCarga').classList.add('hidden');
        document.getElementById('contenidoDashboard').classList.remove('hidden');

        new Chart(document.getElementById('graficoResultados'), {
          type: 'line',
          data: {
            labels: datos.map(d => d.Fecha),
            datasets: [{ label: 'Alcance', data: datos.map(d => Number(d.Alcance || 0)), borderColor: '#8027AC', tension: 0.3, fill: true, backgroundColor: 'rgba(128,39,172,0.1)' }]
          },
          options: { responsive: true, maintainAspectRatio: false }
        });
      } catch (e) {
        document.getElementById('pantallaCarga').innerHTML = `<p class="text-red-600 font-semibold">❌ Error al conectar: ${e.message}</p>`;
      }
    };
  </script>
</body>
</html>
